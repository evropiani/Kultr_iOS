name: iOS

on:
  push:
    branches: ["**", "!ci-screenshots"]
    tags-ignore: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tools
        run: |
          xcodebuild -version
          swift --version

      - name: Core tests
        id: tests
        continue-on-error: true
        run: swift test --package-path KultrCore 2>&1 | tee tests.log | grep -E "error:|failed|passed|Executed" ; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Build (simulator, debug)
        if: github.ref != 'refs/heads/main'
        run: |
          set -o pipefail
          xcodebuild build \
            -project Kultr.xcodeproj \
            -scheme Kultr \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Screenshots in the simulator
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          runtimes = sorted((k for k in devices if 'iOS' in k), reverse=True)
          for runtime in runtimes:
              phones = [d for d in devices[runtime] if d['name'].startswith('iPhone') and 'Pro' in d['name'] and 'Max' not in d['name']]
              if phones:
                  print(phones[0]['udid']); break
          ")
          test -n "$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark || true
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Kultr.app
          mkdir -p shots
          xcrun simctl list devices | grep "$UDID" > shots/device.txt || true
          for screen in home library songs album artist mini player search settings stats; do
            xcrun simctl terminate "$UDID" app.kultr.ios || true
            DATA=$(xcrun simctl get_app_container "$UDID" app.kultr.ios data 2>/dev/null || true)
            [ -n "$DATA" ] && rm -f "$DATA/Documents/kultr-ready-$screen"
            SIMCTL_CHILD_KULTR_DEMO_SERVER=https://demo.navidrome.org SIMCTL_CHILD_KULTR_SCREEN=$screen xcrun simctl launch "$UDID" app.kultr.ios
            DATA=$(xcrun simctl get_app_container "$UDID" app.kultr.ios data)
            for i in $(seq 1 150); do
              [ -f "$DATA/Documents/kultr-ready-$screen" ] && break
              sleep 2
            done
            cat "$DATA/Documents/kultr-ready-$screen" > "shots/$screen.txt" 2>/dev/null || echo "timed out" > "shots/$screen.txt"
            xcrun simctl io "$UDID" screenshot "shots/$screen.png"
          done
          cd shots
          git init -q
          git checkout -q -b ci-screenshots
          git add .
          git -c user.name="Kultr CI" -c user.email="ci@kultr.invalid" commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

      - name: Build unsigned IPA (release)
        if: github.ref == 'refs/heads/main'
        run: |
          set -o pipefail
          xcodebuild build \
            -project Kultr.xcodeproj \
            -scheme Kultr \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/Kultr.app out/Payload/
          (cd out && zip -qry Kultr.ipa Payload)
          ls -lh out/Kultr.ipa

      - name: Fail when core tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            tests.log
          if-no-files-found: ignore

      - name: Upload IPA artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Kultr-ipa
          path: out/Kultr.ipa

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -m1 "MARKETING_VERSION" Kultr.xcodeproj/project.pbxproj | sed -E 's/.*= ([^;]+);/\1/')
          TAG="v${VERSION}"
          NOTES_FILE=".github/release-notes/v${VERSION}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            NOTES_FILE=$(mktemp)
            printf '%s\n' \
              "Kultr for iOS ${VERSION}." \
              "" \
              "## Install" \
              "" \
              "Download **Kultr.ipa** below and install it with Sideloadly (Windows, Mac), AltStore (Windows, Mac) or Impactor (Linux). New to this? Follow the step-by-step guide: https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/INSTALL.md" \
              > "$NOTES_FILE"
          fi
          printf '\n_Build %s, commit %s._\n' "${{ github.run_number }}" "${GITHUB_SHA::7}" >> "$NOTES_FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/Kultr.ipa --clobber
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" out/Kultr.ipa --title "Kultr for iOS ${VERSION}" --notes-file "$NOTES_FILE" --target "$GITHUB_SHA"
          fi
